server:
  port: 9080
  tomcat:
    threads:
      max: 200
      min-spare: 20
    max-connections: 10000
    accept-count: 200

spring:
  datasource:
    password: ${DB_PASSWORD:root}
    hikari:
      maximum-pool-size: 32
      minimum-idle: 8
      connection-timeout: 5000
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false
  ai:
    ollama:
      init:
        pull-model-strategy: never

backend:
  url: http://localhost
  port: 9080

jwt:
  secret: ${JWT_SECRET:dev-jwt-secret-key-for-local-startup-please-change-1234567890}

app:
  dev-services:
    redpanda:
      enabled: false
  docker:
    startup-script:
      enabled: true
    images:
      elasticsearch: ${ELASTICSEARCH_IMAGE:docker.elastic.co/elasticsearch/elasticsearch:9.4.1}
  ollama:
    startup-script:
      enabled: true
  elasticsearch:
    fallback:
      enabled: true
    startup-sync:
      enabled: false
  security:
    token-blacklist:
      fail-open: true

management:
  health:
    elasticsearch:
      enabled: false

rag:
  retrieval:
    enabled: true
    candidate-multiplier: 2
