[project]
name = "ragas-eval"
version = "0.1.0"
description = "Offline RAGAS answer-quality evaluation for the Spring backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ragas==0.4.3",
    # ragas 0.4.3 imports langchain_community.chat_models.vertexai, which langchain-community 0.4 removed.
    "langchain>=0.3.27,<0.4",
    "langchain-core>=0.3.78,<0.4",
    "langchain-community>=0.3.31,<0.4",
    "langchain-openai>=0.3.35,<0.4",
    "langchain-ollama>=0.3.10,<0.4",
    "datasets>=4,<5",
    "pandas>=2.2,<3",
    "httpx[socks]>=0.27,<1",
    "python-dotenv>=1,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
ragas-eval = "ragas_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ragas_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
