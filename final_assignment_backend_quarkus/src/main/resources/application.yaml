          topic: system_create.DLT
      system_settings_create:
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: system_settings_create.DLT
      system_settings_update:
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: system_settings_update.DLT
      system_update:
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: system_update.DLT
      user_create:
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: user_create.DLT
      user_update:
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: user_update.DLT
      vehicle_create:
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: vehicle_create.DLT
      vehicle_update:
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: vehicle_update.DLT
  jwt:
    verify:
      publickey:
        algorithm: HS256
      issuer: https://quarkus.io/issuer
kafka:
