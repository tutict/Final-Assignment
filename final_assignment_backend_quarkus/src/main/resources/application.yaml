# ────────────────────────────────────────────────────────────────────────────
# Quarkus 配置（纳入版本控制部分）。
# 本仓库的 *.properties 被 .gitignore 忽略（运行期主配置 datasource / jwt.secret.key /
# mp.messaging / quarkus.redis.hosts 等由外部环境变量或部署挂载提供，不纳入版本控制）。
# 这里用 YAML 文件（不被 .gitignore 忽略）承载那些"构建期就必需、且无默认值"的配置项——
# 主要是 Redis 缓存的 value-type：quarkus-redis-cache 的 RedisCacheProcessor 在构建期
# 需要为每个 @CacheResult 使用的缓存名确定 value-type，否则 quarkusAppPartsBuild 会失败。
# 各 value-type 取自对应 Service 中 @CacheResult 方法的返回类型。
# ────────────────────────────────────────────────────────────────────────────

quarkus:
  cache:
    redis:
      appealCache:
        value-type: finalassignmentbackend.entity.AppealRecord
      appealReviewCache:
        value-type: finalassignmentbackend.entity.AppealReview
      auditLoginLogCache:
        value-type: finalassignmentbackend.entity.AuditLoginLog
      auditOperationLogCache:
        value-type: finalassignmentbackend.entity.AuditOperationLog
      deductionRecordCache:
        value-type: finalassignmentbackend.entity.DeductionRecord
      driverCache:
        value-type: finalassignmentbackend.entity.DriverInformation
      driverVehicleCache:
        value-type: finalassignmentbackend.entity.DriverVehicle
      fineRecordCache:
        value-type: finalassignmentbackend.entity.FineRecord
      offenseRecordCache:
        value-type: finalassignmentbackend.entity.OffenseRecord
      offenseTypeDictCache:
        value-type: finalassignmentbackend.entity.OffenseTypeDict
      paymentRecordCache:
        value-type: finalassignmentbackend.entity.PaymentRecord
      sysBackupRestoreCache:
        value-type: finalassignmentbackend.entity.SysBackupRestore
      sysDictCache:
        value-type: finalassignmentbackend.entity.SysDict
      sysPermissionCache:
        value-type: finalassignmentbackend.entity.SysPermission
      sysRequestHistoryCache:
        value-type: finalassignmentbackend.entity.SysRequestHistory
      sysRoleCache:
        value-type: finalassignmentbackend.entity.SysRole
      sysRolePermissionCache:
        value-type: finalassignmentbackend.entity.SysRolePermission
      sysSettingsCache:
        value-type: finalassignmentbackend.entity.SysSettings
      sysUserCache:
        value-type: finalassignmentbackend.entity.SysUser
      sysUserRoleCache:
        value-type: finalassignmentbackend.entity.SysUserRole
      userCache:
        value-type: finalassignmentbackend.dto.UserResponse
      vehicleCache:
        value-type: finalassignmentbackend.entity.VehicleInformation
  # CORS for the Quarkus REST layer (the actual HTTP server frontend talks to).
  # Without this the browser blocks /api/ai/chat/stream and every other call
  # made cross-origin from the Flutter web app (origin http://localhost:3000).
  # allowedOrigns as a pattern covers the dev origins without a literal "*"
  # origin, whose combination with allowCredentials is rejected by browsers.
  http:
    cors:
      enabled: true
      origins: http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173,http://localhost:15173,http://127.0.0.1:15173,http://localhost:13000,http://127.0.0.1:13000
      methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
      headers: Authorization,Content-Type,Idempotency-Key,X-Trace-Id,Cache-Control,Accept,X-Requested-With
      exposed-headers: X-Trace-Id
      access-control-allow-credentials: true
    auth:
      policy:
        metrics-admin:
          roles-allowed: ADMIN,SUPER_ADMIN
      permission:
        health-public:
          paths: /q/health,/q/health/live,/q/health/ready,/actuator/health,/actuator/health/liveness,/actuator/health/readiness,/api/health,/api/actuator/health,/readyz
          policy: permit
        public:
          paths: /api/auth/login,/api/auth/register,/api/auth/refresh
          policy: permit
        api:
          paths: "/api/*"
          policy: authenticated
        metrics:
          paths: /actuator/prometheus,/actuator/ledgerReconcile,/q/metrics
          policy: metrics-admin

  datasource:
    jdbc:
      max-size: 20
      acquisition-timeout: 200ms
      new-connection-sql: SET SESSION max_execution_time=3000
  redis:
    timeout: 300ms
    blacklist:
      timeout: 200ms
      hosts: ${quarkus.redis.hosts:redis://localhost:6379}

rag:
  enabled: true
  indexing:
    enabled: true
  chunk:
    size: 500
    overlap: 100

# Align HTTP Bearer verification (quarkus-smallrye-jwt) with TokenProvider HS256 signing.
# TokenProvider HMAC-SHA256s jwt.secret.key as UTF-8 (or standard-Base64 if the value decodes).
# SmallRye HTTP auth only accepts HMAC secrets as an oct JWK, not a raw string (it tries PEM/JWK).
# The k value is base64url(UTF-8 bytes of the default jwt.secret.key). Override both together.
jwt:
  secret:
    key: ${JWT_SECRET_KEY:${JWT_SECRET:dev-jwt-secret-key-for-local-startup-please-change-1234567890}}
smallrye:
  jwt:
    new-token:
      issuer: https://quarkus.io/issuer
    path:
      groups: roles
    groups-separator: ','
    verify:
      algorithm: HS256
      secretkey: '{"kty":"oct","alg":"HS256","k":"ZGV2LWp3dC1zZWNyZXQta2V5LWZvci1sb2NhbC1zdGFydHVwLXBsZWFzZS1jaGFuZ2UtMTIzNDU2Nzg5MA"}'
    sign:
      # DevModeProcessor only skips RSA key generation when smallrye.jwt.sign.key is set.
      key: ${jwt.secret.key}
mp:
  messaging:
    outgoing:
      offense-create-out:
        connector: smallrye-kafka
        topic: offense_create
        value:
          serializer: org.apache.kafka.common.serialization.StringSerializer
        acks: all
        retries: 3
        kafka-configuration: ledger-producer
      offense-update-out:
        connector: smallrye-kafka
        topic: offense_update
        value:
          serializer: org.apache.kafka.common.serialization.StringSerializer
        acks: all
        retries: 3
        kafka-configuration: ledger-producer
      payment-create-out:
        connector: smallrye-kafka
        topic: payment_record_create
        value:
          serializer: org.apache.kafka.common.serialization.StringSerializer
        acks: all
        retries: 3
        kafka-configuration: ledger-producer
    incoming:
      offense_create:
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: offense_create.DLT
      offense_update:
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: offense_update.DLT
      appeal_create:
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: appeal_create.DLT
      appeal_update:
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: appeal_update.DLT
      backup_restore_create:
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: backup_restore_create.DLT
      backup_restore_update:
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: backup_restore_update.DLT
      deduction_create:
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: deduction_create.DLT
      deduction_update:
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: deduction_update.DLT
      driver_create:
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: driver_create.DLT
      driver_update:
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: driver_update.DLT
      fine_create:
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: fine_create.DLT
      fine_update:
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: fine_update.DLT
      login_create:
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: login_create.DLT
      login_update:
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: login_update.DLT
      operation_create:
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: operation_create.DLT
      operation_update:
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: operation_update.DLT
      permission_create:
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: permission_create.DLT
      permission_update:
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: permission_update.DLT
      role_create:
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: role_create.DLT
      role_update:
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: role_update.DLT
      system_create:
        failure-strategy: dead-letter-queue
