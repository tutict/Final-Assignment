    servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
"%dev":
  app:
    security:
      token-blacklist:
        fail-open: ${TOKEN_BLACKLIST_FAIL_OPEN:false}

app:
  security:
    token-blacklist:
      fail-open: ${TOKEN_BLACKLIST_FAIL_OPEN:false}
reliability:
  load-shed: ${RELIABILITY_LOAD_SHED:true}
