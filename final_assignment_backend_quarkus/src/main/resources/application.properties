# Payment create is derived. MySQL commit already returned; this producer is bounded and failures are only counted.
mp.messaging.outgoing.payment-create-out.connector=smallrye-kafka
mp.messaging.outgoing.payment-create-out.topic=payment_record_create
mp.messaging.outgoing.payment-create-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.payment-create-out.acks=all
mp.messaging.outgoing.payment-create-out.retries=3
mp.messaging.outgoing.payment-create-out.kafka-configuration=ledger-producer

# Browser origins match Spring. Credentials stay on; do not use *.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173,http://localhost:15173,http://127.0.0.1:15173,http://localhost:13000,http://127.0.0.1:13000
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type,Accept,X-Requested-With,Cache-Control,Idempotency-Key,X-Trace-Id
quarkus.http.cors.exposed-headers=X-Trace-Id
quarkus.http.cors.access-control-allow-credentials=true
