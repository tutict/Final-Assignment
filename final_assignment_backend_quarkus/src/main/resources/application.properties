# ────────────────────────────────────────────────────────────────────────────
# Quarkus 应用配置（增量）。
# 说明：本仓库的运行期主配置（datasource / jwt.secret.key / mp.messaging.incoming.* /
# quarkus.redis.* 等）由外部提供（环境变量或部署挂载）。此文件只声明"新增代码所需、
# 且无默认值"的配置项，避免与外部配置冲突。
# ────────────────────────────────────────────────────────────────────────────

# ── Offense 治理：service 层出站 Kafka 通道（回灌监听器消费的主题，形成治理闭环）──
mp.messaging.outgoing.offense-create-out.connector=smallrye-kafka
mp.messaging.outgoing.offense-create-out.topic=offense_create
mp.messaging.outgoing.offense-create-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.offense-create-out.acks=all
mp.messaging.outgoing.offense-create-out.retries=3
mp.messaging.outgoing.offense-create-out.kafka-configuration=ledger-producer

mp.messaging.outgoing.offense-update-out.connector=smallrye-kafka
mp.messaging.outgoing.offense-update-out.topic=offense_update
mp.messaging.outgoing.offense-update-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.offense-update-out.acks=all
mp.messaging.outgoing.offense-update-out.retries=3
mp.messaging.outgoing.offense-update-out.kafka-configuration=ledger-producer

# ── Auth（可选，均有代码内默认值，此处显式列出便于运维覆盖）──
# jwt.refresh-token-expiration：refresh token 有效期（秒），默认 7 天
jwt.refresh-token-expiration=604800
# app.security.token-blacklist.fail-open：Redis 不可用时是否放行（false=拒绝，更安全）
app.security.token-blacklist.fail-open=false
# jwt.ml-kem.private-key / jwt.ml-kem.public-key：ML-KEM PEM 密钥；留空则启动时生成临时密钥
# （临时密钥重启后 refresh token 失效，生产环境请通过外部配置注入固定密钥）
# REST security defaults: auth bootstrap endpoints stay public; every other /api route requires a valid JWT.
quarkus.http.auth.permission.public.paths=/api/auth/login,/api/auth/register,/api/auth/refresh
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.api.paths=/api/*
quarkus.http.auth.permission.api.policy=authenticated
# Align SmallRye JWT HTTP verification with TokenProvider HS256 (see application.yaml).
# Signing and verification keys must be rotated together; JwtConfigConsistencyValidator fails startup on drift.
smallrye.jwt.sign.key=${jwt.secret.key}
# Production must inject the JWK explicitly; there is intentionally no default here.
smallrye.jwt.verify.secretkey=${JWT_VERIFY_JWK}
%dev.jwt.secret.key=dev-jwt-secret-key-for-local-startup-please-change-1234567890
%test.jwt.secret.key=dev-jwt-secret-key-for-local-startup-please-change-1234567890
%dev.smallrye.jwt.verify.secretkey={"kty":"oct","alg":"HS256","k":"ZGV2LWp3dC1zZWNyZXQta2V5LWZvci1sb2NhbC1zdGFydHVwLXBsZWFzZS1jaGFuZ2UtMTIzNDU2Nzg5MA"}
%test.smallrye.jwt.verify.secretkey={"kty":"oct","alg":"HS256","k":"ZGV2LWp3dC1zZWNyZXQta2V5LWZvci1sb2NhbC1zdGFydHVwLXBsZWFzZS1jaGFuZ2UtMTIzNDU2Nzg5MA"}
mp.jwt.verify.publickey.algorithm=HS256
mp.jwt.verify.issuer=https://quarkus.io/issuer
smallrye.jwt.path.groups=roles
smallrye.jwt.groups-separator=,


quarkus.http.auth.permission.health.paths=/actuator/health,/q/health,/q/health/*
quarkus.http.auth.permission.health.policy=permit
quarkus.http.auth.permission.metrics.paths=/actuator/prometheus,/actuator/ledgerReconcile
quarkus.http.auth.policy.metrics-admin.roles-allowed=ADMIN,SUPER_ADMIN
quarkus.http.auth.permission.metrics.policy=metrics-admin
quarkus.datasource.jdbc.acquisition-timeout=200ms
reliability.load-shed=${RELIABILITY_LOAD_SHED:true}
quarkus.redis.timeout=300ms
quarkus.redis.blacklist.timeout=200ms
quarkus.redis.blacklist.hosts=${quarkus.redis.hosts:redis://localhost:6379}
quarkus.datasource.jdbc.new-connection-sql=SET SESSION max_execution_time=3000

# Cap offense consumers: the listener retries 3 times, then the existing <topic>.DLT. Do not rename offense_create.
mp.messaging.incoming.offense_create.failure-strategy=dead-letter-queue
mp.messaging.incoming.offense_create.dead-letter-queue.topic=offense_create.DLT
mp.messaging.incoming.offense_update.failure-strategy=dead-letter-queue
mp.messaging.incoming.offense_update.dead-letter-queue.topic=offense_update.DLT

# Remaining consumers retry in the listener, then use <channel>.DLT. Channel names are unchanged.
mp.messaging.incoming.appeal_create.failure-strategy=dead-letter-queue
mp.messaging.incoming.appeal_create.dead-letter-queue.topic=appeal_create.DLT
mp.messaging.incoming.appeal_update.failure-strategy=dead-letter-queue
