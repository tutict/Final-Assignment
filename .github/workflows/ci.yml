# CI for the four-backend + two-frontend matrix.
# Strategy: build/test only what each stack can verify without live infrastructure.
# Testcontainers jobs use the built-in Docker; integration tests that need
# MySQL/Redis set USE_TESTCONTAINERS=true, otherwise they run against the
# H2/embedded profile or are skipped via their own assumptions.
#
# k6 is intentionally NOT run here: the scenarios need a live backend + DB.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spring-backend:
    name: Spring Boot (backend)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: traffic_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build (skip tests; unit-test job runs them)
        working-directory: finalAssignmentBackend
        run: mvn -B -ntp compile

      - name: Unit tests (Testcontainers available via the runner Docker)
        working-directory: finalAssignmentBackend
        run: mvn -B -ntp test

  spring-cloud:
    name: Spring Cloud (modules)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: traffic
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      # 网关的 BusinessEventSubscriber 在启动时就要连 Redis，缺失会让网关上下文加载失败。
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      # user/traffic/system/audit 模块共享 traffic 库；auth 模块单独使用 traffic_test 库。
      TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/traffic?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      TEST_DB_USERNAME: root
      TEST_DB_PASSWORD: root
      AUTH_TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/traffic_test?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      AUTH_TEST_DB_USERNAME: root
      AUTH_TEST_DB_PASSWORD: root
      INTERNAL_SERVICE_TOKEN: ci-only-internal-service-token-32-bytes-min
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Seed MySQL schema
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS traffic_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          mysql -h 127.0.0.1 -uroot -proot traffic < database/traffic.sql
          mysql -h 127.0.0.1 -uroot -proot traffic_test < database/traffic.sql
      - name: Compile all modules
        working-directory: finalAssignmentCloud
        run: mvn -B -ntp compile
      - name: Unit + integration tests
        working-directory: finalAssignmentCloud
        run: mvn -B -ntp test

  quarkus-backend:
    name: Quarkus (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile + tests
        working-directory: final_assignment_backend_quarkus
        run: ./gradlew --console=plain test classes

  go-backend:
    name: Go (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: final_assignment_backend_go/go.mod
          cache-dependency-path: final_assignment_backend_go/go.sum
      - name: Vet + build + tests
        working-directory: final_assignment_backend_go
        run: |
          go vet ./...
          go build ./...
          go test ./... -count=1

  ai-quality-gates:
    name: AI quality gates (config parity + RAGAS tooling)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 四个后端的检索/聊天参数一旦漂移就挡在这里（纯标准库，不需要任何服务）。
      - name: Cross-backend RAG config parity
        run: python scripts/check-rag-config-parity.py
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: scripts/ragas/uv.lock
      # RAGAS 评测工具链自身的单元测试：不连 ES/MySQL/Ollama，只验证解析、聚合、
      # 配置口径与跨后端文案一致性。端到端评测仍需本地跑，见 scripts/ragas/README.md。
      - name: RAGAS tooling unit tests
        working-directory: scripts/ragas
        run: |
          uv sync --frozen
          uv run --frozen pytest tests -q

  react-frontend:
    name: React (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: final_assignment_front_react/package-lock.json
      - name: Install + typecheck + test + build
        working-directory: final_assignment_front_react
        run: |
          npm ci
          npm run typecheck
          npm run test
          npm run build

  flutter-frontend:
    name: Flutter Web (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get + analyze + tests
        working-directory: final_assignment_front
        run: |
          flutter pub get
          flutter analyze --no-pub --fatal-infos
          flutter test

  docker-images:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [spring-backend, go-backend]
    steps:
      - uses: actions/checkout@v4
      - name: Build Spring image
        run: docker build -f finalAssignmentBackend/Dockerfile -t final-assignment-spring:ci .
      - name: Build Go image
        run: docker build -f final_assignment_backend_go/Dockerfile -t final-assignment-go:ci .
      - name: Validate compose.app.yml
        env:
          MYSQL_PASSWORD: ci-only
          REDIS_PASSWORD: ci-only
          JWT_SECRET: ci-only-not-a-real-secret
        run: docker compose -f compose.app.yml config --quiet
