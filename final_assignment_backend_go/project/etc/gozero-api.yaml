Name: final-assignment-go-api
Host: 0.0.0.0
Port: 8081
Timeout: 3000
MaxBytes: 1048576
Rag:
  Enabled: true
  IndexingEnabled: true
  EmbeddingEnabled: true
  RetrievalEnabled: true
  MySQLDSN: "root:root@tcp(localhost:3306)/rag_db?charset=utf8mb4&parseTime=True&loc=Local"
  ElasticsearchAddresses: ["http://127.0.0.1:9200"]
  ElasticsearchUsername: ""
  ElasticsearchPassword: ""
  # 768 维向量与 Spring/Quarkus 参考实现保持一致；nomic-embed-text 的维度不可改写，
  # 换嵌入模型时必须换索引名，否则旧映射会拒绝新向量。
  ElasticsearchIndex: rag_chunk_go_768_v1
  ElasticsearchAlias: rag_chunk_go_current
  EmbeddingProvider: ollama
  EmbeddingModel: nomic-embed-text
  EmbeddingDimensions: 768
  OllamaBaseURL: http://127.0.0.1:11434
  OllamaTimeoutMillis: 30000
  MaxBatchSize: 500
  MaxRequeueLimit: 5000
  MaxUploadBytes: 8388608
  RetrievalTopK: 10
  VectorWeight: 0.2
  BM25Weight: 0.8
  MinScore: 0.2
  CandidateMultiplier: 3
  RRFRankConstant: 60
  RerankEnabled: true
  RerankLexicalWeight: 0.15
  AutoMigrate: true
