Name: final-assignment-go-api
Host: 0.0.0.0
Port: 8081
Timeout: 3000
MaxBytes: 10485760
Rag:
  Enabled: true
  IndexingEnabled: true
  EmbeddingEnabled: true
  RetrievalEnabled: true
  # Local-dev DSN for the RAG live pipeline; override per environment with the
  # RAG_MYSQL_DSN env var (see project/deploy/rag/README.md) instead of editing
  # this file.
  MySQLDSN: "root:local-dev@tcp(127.0.0.1:3307)/final_assignment?charset=utf8mb4&parseTime=True&loc=Local"
  ElasticsearchAddresses:
    - "http://127.0.0.1:9201"
  ElasticsearchUsername: ""
  ElasticsearchPassword: ""
  # 别名带 live 后缀：共享集群里 rag_chunk_current 属于 Spring 压测索引，
  # 共用别名会让两套后端互相覆盖向量。
  ElasticsearchIndex: rag_chunk_go_live_v1
  ElasticsearchAlias: rag_chunk_go_live_current
  EmbeddingProvider: deterministic
  EmbeddingModel: deterministic-384
  EmbeddingDimensions: 384
  OllamaBaseURL: http://127.0.0.1:11434
  OllamaTimeoutMillis: 30000
  MaxBatchSize: 500
  MaxRequeueLimit: 5000
  MaxUploadBytes: 8388608
  RetrievalTopK: 10
  VectorWeight: 0.2
  BM25Weight: 0.8
  MinScore: 0.2
  CandidateMultiplier: 3
  RRFRankConstant: 60
  RerankEnabled: true
  RerankLexicalWeight: 0.15
  AutoMigrate: true
