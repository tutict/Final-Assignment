spring:
  application:
    name: finalassignmentcloud-ai
  ai:
    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:${OLLAMA_MODEL:llama3.2}}
      embedding:
        options:
          model: ${RAG_EMBEDDING_MODEL:nomic-embed-text}
  main:
    keep-alive: ${SPRING_MAIN_KEEP_ALIVE:${SPRING_THREADS_VIRTUAL_ENABLED:false}}
  threads:
    virtual:
      enabled: ${SPRING_THREADS_VIRTUAL_ENABLED:false}
  config:
    import: "optional:nacos:${spring.application.name}"
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
      config:
        server-addr: ${NACOS_SERVER:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        file-extension: yaml
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
server:
  port: 18086
management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,prometheus
ai:
  chat:
    timeout-millis: ${AI_CHAT_TIMEOUT_MILLIS:30000}
  search:
    timeout-seconds: ${AI_SEARCH_TIMEOUT:30}
  rag:
    enabled: ${AI_RAG_ENABLED:false}
    # 与 Spring 单体（rag.retrieval.top-k）和 Go（chat_pipeline 的 defaultTopK）保持一致：
    # 这是交互式聊天不带 metadata.ragTopK 时的默认上下文条数。RAGAS 评测每轮都显式传
    # ragTopK（默认 5），所以评测分数不受这里影响，改的是真实用户看到的检索深度。
    top-k: ${AI_RAG_TOP_K:10}
  guardrail:
    # When a turn actually relies on retrieval, the answer must cite a source; otherwise
    # the model output is replaced with a safe fallback. Set to false to disable.
    citation-enforcement:
      enabled: ${AI_GUARDRAIL_CITATION_ENFORCEMENT:true}
    # Post-generation check: the cited sources must also be about the asked subject.
    # Fails open on judge errors and only runs when a judge model is configured.
    topic-verification:
      enabled: ${AI_GUARDRAIL_TOPIC_VERIFICATION:true}
      model: ${AI_GUARDRAIL_TOPIC_MODEL:}
      timeout: ${AI_GUARDRAIL_TOPIC_TIMEOUT:PT12S}
  ollama:
    enabled: ${OLLAMA_ENABLED:true}
    base-url: ${OLLAMA_URL:http://localhost:11434}
    chat-model: ${OLLAMA_CHAT_MODEL:${OLLAMA_MODEL:llama3.2}}
    # Low temperature keeps citation and language adherence stable for grounded answers.
    temperature: ${OLLAMA_TEMPERATURE:0.2}
  agent:
    # When disabled, chat answers come straight from the model + retrieved context instead of
    # the tool-routing agent loop. Used by offline RAG answer evaluation.
    enabled: ${AI_AGENT_ENABLED:true}
    max-rounds: ${AI_AGENT_MAX_ROUNDS:4}
    draft:
      store: ${AI_AGENT_DRAFT_STORE:memory}

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
