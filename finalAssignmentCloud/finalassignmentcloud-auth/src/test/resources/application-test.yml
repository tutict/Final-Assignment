spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: ${AUTH_TEST_DB_URL:jdbc:mysql://localhost:3306/traffic_test?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${AUTH_TEST_DB_USERNAME:root}
    password: ${AUTH_TEST_DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:250}
      data-source-properties:
        sessionVariables: max_execution_time=3000
  cloud:
    nacos:
      config:
        enabled: false
      discovery:
        enabled: false
  kafka:
    listener:
      auto-startup: false
  data:
    redis:
      repositories:
        enabled: false
    elasticsearch:
      repositories:
        enabled: false

management:
  health:
    elasticsearch:
      enabled: false
    redis:
      enabled: false
    kafka:
      enabled: false

jwt:
  secret:
    key: ${AUTH_TEST_JWT_SECRET:Y2xvdWQtYXV0aC1pbnRlZ3JhdGlvbi10ZXN0LXNlY3JldC1rZXktMjAyNi1yb3RhdGlvbg==}
  algorithm: HS256
  access-token-expiration: 3600
  refresh-token-expiration: 86400

internal:
  service-token: ${INTERNAL_SERVICE_TOKEN:test-internal-service-token-32bytes-ok}

logging:
  level:
    com.tutict.finalassignmentcloud: DEBUG
