app:
  websocket:
    allowed-origins: &allowedOrigins
      - http://localhost:3000
      - http://127.0.0.1:3000
      - http://localhost:8080
      - http://127.0.0.1:8080
      - http://localhost:5173
      - http://127.0.0.1:5173
      - http://localhost:15173
      - http://127.0.0.1:15173
      - http://localhost:13000
      - http://127.0.0.1:13000

spring:
  application:
    name: finalassignmentcloud-gateway
  config:
    import: "optional:nacos:${spring.application.name}"
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
      config:
        server-addr: ${NACOS_SERVER:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        file-extension: yaml
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
    gateway:
      discovery:
        locator:
          enabled: true
      server:
        webflux:
          discovery:
            locator:
              enabled: true
          default-filters:
            # 内部服务令牌仅由服务间调用注入，网关必须剥离客户端携带的同名请求头，
            # 否则外部请求可借该请求头冒用内部服务身份。
            - RemoveRequestHeader=X-Internal-Service-Token
          httpclient:
            connect-timeout: 1000
            response-timeout: 3s
          routes:
            - id: auth-service
              uri: lb://finalassignmentcloud-auth
              predicates:
                - Path=/api/auth/**,/api/ws-ticket
            - id: user-service
              uri: lb://finalassignmentcloud-user
              predicates:
                - Path=/api/users/**,/api/permissions/**,/api/roles/**
            - id: traffic-service
              uri: lb://finalassignmentcloud-traffic
              predicates:
                - Path=/api/offenses/**,/api/offense-types/**,/api/violations/**,/api/deductions/**,/api/fines/**,/api/payments/**,/api/vehicles/**,/api/drivers/**,/api/appeals/**,/api/progress/**,/api/workflow/**,/api/view/offenses/**,/api/feedback/**,/api/cache/**
            - id: audit-service
              uri: lb://finalassignmentcloud-audit
              predicates:
                - Path=/api/audit/**,/api/system/logs/**,/api/logs/**
            - id: system-service
              uri: lb://finalassignmentcloud-system
              predicates:
                - Path=/api/system/**
            - id: rag-service
              uri: lb://finalassignmentcloud-rag
              predicates:
                - Path=/api/rag/**
              metadata:
                # metadata.response-timeout 在 Gateway 5.0.3 由 NettyRoutingFilter 按毫秒解析，写成 120s 会被回退到全局 3s
                response-timeout: 120000
            - id: ai-service
              uri: lb://finalassignmentcloud-ai
              predicates:
                - Path=/api/ai/**
              metadata:
                # 需同时容纳一次 llama3.2 推理与 SSE 流式输出，故高于 AI 服务自身的 30s 动作预算
                response-timeout: 120000
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins: *allowedOrigins
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - PATCH
                  - OPTIONS
                allowedHeaders:
                  - Authorization
                  - Content-Type
                  - Idempotency-Key
                  - X-Trace-Id
                  - Cache-Control
                  - Accept
                  - X-Requested-With
                exposedHeaders:
                  - X-Trace-Id
                allowCredentials: true
server:
  port: 8080
management:
  endpoint:
    health:
      show-details: never
  health:
    discovery:
      enabled: false
    reactive-discovery:
      enabled: false
    redis:
      enabled: ${MANAGEMENT_HEALTH_REDIS_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health


logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
