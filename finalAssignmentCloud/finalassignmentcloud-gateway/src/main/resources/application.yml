spring:
  application:
    name: finalassignmentcloud-gateway
  config:
    import: "optional:nacos:"
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
      config:
        server-addr: ${NACOS_SERVER:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        file-extension: yaml
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
    gateway:
      discovery:
        locator:
          enabled: true
      server:
        webflux:
          discovery:
            locator:
              enabled: true
          httpclient:
            connect-timeout: 1000
            response-timeout: 3s
          routes:
            - id: auth-service
              uri: lb://finalassignmentcloud-auth
              predicates:
                - Path=/api/auth/**
            - id: user-service
              uri: lb://finalassignmentcloud-user
              predicates:
                - Path=/api/users/**,/api/permissions/**,/api/roles/**
            - id: traffic-service
              uri: lb://finalassignmentcloud-traffic
              predicates:
                - Path=/api/offenses/**,/api/offense-types/**,/api/violations/**,/api/deductions/**,/api/fines/**,/api/payments/**,/api/vehicles/**,/api/drivers/**,/api/appeals/**,/api/progress/**,/api/workflow/**,/api/view/offenses/**
            - id: audit-service
              uri: lb://finalassignmentcloud-audit
              predicates:
                - Path=/api/audit/**,/api/system/logs/**,/api/logs/**
            - id: system-service
              uri: lb://finalassignmentcloud-system
              predicates:
                - Path=/api/system/**
            - id: rag-service
              uri: lb://finalassignmentcloud-rag
              predicates:
                - Path=/api/rag/**
              metadata:
                response-timeout: 8000
            - id: search-service
              uri: lb://finalassignmentcloud-search
              predicates:
                - Path=/api/search/**
            - id: ai-service
              uri: lb://finalassignmentcloud-ai
              predicates:
                - Path=/api/ai/**
              metadata:
                response-timeout: 8000
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - http://localhost:3000
              - http://127.0.0.1:3000
              - http://localhost:8080
              - http://127.0.0.1:8080
              - http://localhost:5173
              - http://127.0.0.1:5173
              - http://localhost:15173
              - http://127.0.0.1:15173
              - http://localhost:13000
              - http://127.0.0.1:13000
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders:
              - Authorization
              - Content-Type
              - Idempotency-Key
              - X-Trace-Id
              - Cache-Control
              - Accept
              - X-Requested-With
            exposedHeaders:
              - X-Trace-Id
            allowCredentials: true
      routes:
        - id: auth-service
          uri: lb://finalassignmentcloud-auth
          predicates:
            - Path=/api/auth/**
        - id: user-service
          uri: lb://finalassignmentcloud-user
          predicates:
            - Path=/api/users/**,/api/permissions/**,/api/roles/**
        - id: traffic-service
          uri: lb://finalassignmentcloud-traffic
          predicates:
            - Path=/api/offenses/**,/api/offense-types/**,/api/violations/**,/api/deductions/**,/api/fines/**,/api/payments/**,/api/vehicles/**,/api/drivers/**,/api/appeals/**,/api/progress/**,/api/workflow/**,/api/view/offenses/**
        - id: audit-service
          uri: lb://finalassignmentcloud-audit
          predicates:
            - Path=/api/audit/**,/api/system/logs/**,/api/logs/**
        - id: system-service
          uri: lb://finalassignmentcloud-system
          predicates:
            - Path=/api/system/**
        - id: rag-service
          uri: lb://finalassignmentcloud-rag
          predicates:
            - Path=/api/rag/**
        - id: search-service
          uri: lb://finalassignmentcloud-search
          predicates:
            - Path=/api/search/**
        - id: ai-service
          uri: lb://finalassignmentcloud-ai
          predicates:
            - Path=/api/ai/**
server:
  port: 8080
management:
  endpoint:
    health:
      show-details: never
  health:
    discovery:
      enabled: false
    reactive-discovery:
      enabled: false
    redis:
      enabled: ${MANAGEMENT_HEALTH_REDIS_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health


logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
