# Prometheus scrape config for the compose.app.yml stack.
# Scenarios in docs/reliability/slo.md are verified against exactly these series.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: spring-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["spring-backend:8080"]

  - job_name: go-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["go-backend:8080"]
